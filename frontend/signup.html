{% extends "layout.html" %}
{% block title %}Create Account{% endblock %}

{% block content %}
<!-- Center signup card with side-by-side form layout -->
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <!-- Card header with primary color -->
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Create New Account</h4>
            </div>
            <div class="card-body">
                <!-- Signup form - POST request, form ID for validation -->
                <form method="POST" action="{{ url_for('signup') }}" id="signupForm">
                    <!-- Username and Email fields - side by side on larger screens -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required>
                            <div class="form-text">3-20 characters</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
                        </div>
                    </div>
                    
                    <!-- Password and Confirm Password - side by side, with real-time match feedback -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="8">
                            <div class="form-text">Minimum 8 characters, Atleast one letter, One number, and One special character</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
                            <!-- Real-time password match feedback -->
                            <div id="passwordMatch" class="form-text"></div>
                        </div>
                    </div>
                    
                    <!-- Phone and Terms Checkbox - side by side -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <!-- Numbers only input - auto-removes non-numeric characters -->
                            <input type="tel" class="form-control" id="phone" name="phone" pattern="[0-9]*" inputmode="numeric" placeholder="e.g., 1234567890" value="{{ phone or '' }}">
                            <div class="form-text">Numbers only</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <!-- Terms checkbox aligned with phone field -->
                            <label for="terms" class="form-label">&nbsp;</label>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I accept Terms & Conditions
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Cancel and Submit buttons -->
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('login') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
                    </div>
                    
                    <!-- Link to login page -->
                    <div class="text-center mt-3">
                        <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Real-time password confirmation validation - shows match status as user types
function checkPassword() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const matchDiv = document.getElementById('passwordMatch');
    const submitBtn = document.getElementById('submitBtn');
    
    // Clear feedback if confirm field is empty
    if (confirmPassword === '') {
        matchDiv.innerHTML = '';
        matchDiv.className = 'form-text';
        submitBtn.disabled = false;
        return;
    }
    
    // Show match feedback with color coding
    if (password === confirmPassword) {
        matchDiv.innerHTML = '<i class="fas fa-check text-success me-1"></i>Passwords match';
        matchDiv.className = 'form-text text-success';
        submitBtn.disabled = false;
    } else {
        matchDiv.innerHTML = '<i class="fas fa-times text-danger me-1"></i>Passwords do not match';
        matchDiv.className = 'form-text text-danger';
        submitBtn.disabled = true;
    }
}

// Trigger password check when either password field changes
document.getElementById('password').addEventListener('keyup', checkPassword);
document.getElementById('confirm_password').addEventListener('keyup', checkPassword);

// Phone number validation - auto-remove non-numeric characters as user types
document.getElementById('phone').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});

// Form validation on submit - final checks before sending
document.getElementById('signupForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // Prevent submission if passwords don't match
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
        return false;
    }
    
    // Prevent submission if password too short
    if (password.length < 8) {
        e.preventDefault();
        alert('Password must be at least 8 characters');
        return false;
    }
    
    return true;
});
</script>
{% endblock %}
