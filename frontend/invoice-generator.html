<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoice Generator</title>
  <style>
    :root { --bg:#faf8f5; --fg:#1f1d1a; --muted:#6b665f; --line:#e3ded6; --card:#fff; --accent:#1f1d1a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161513; --fg:#f0ece6; --muted:#9a948b; --line:#33302c; --card:#1e1c1a; --accent:#f0ece6; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
    main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
    h1 { margin:0 0 4px; } .muted { color:var(--muted); margin:0 0 24px; }
    form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
    label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
    input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
    h2 { font-size:16px; margin:24px 0 8px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:12px; color:var(--muted); padding:4px; }
    td { padding:4px; } td input { width:100%; } td.amt { text-align:right; white-space:nowrap; }
    .num { text-align:right; } td input.num { text-align:right; }
    button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--fg); cursor:pointer; }
    button.primary { background:var(--accent); color:var(--bg); }
    .totals { margin:16px 0 0 auto; width:260px; } .totals div { display:flex; justify-content:space-between; padding:2px 0; }
    .totals .grand { font-weight:700; border-top:1px solid var(--line); margin-top:4px; padding-top:6px; }
    .actions { display:flex; gap:10px; margin-top:20px; align-items:center; } #msg { color:#b3261e; }
  </style>
</head>
<body>
<main>
  <h1>Invoice Generator</h1>
  <p class="muted">Fill in the details, then download the invoice as a PDF.</p>
  <form id="f">
    <div class="grid">
      <label>Invoice number <input name="invoice_number" required /></label>
      <label>Seller <input name="seller" required /></label>
      <label>Buyer <input name="buyer" required /></label>
      <label>Issue date <input type="date" name="issue_date" required /></label>
      <label>Service date <input type="date" name="service_date" required /></label>
      <label>Payment method <input name="payment_method" required /></label>
      <label>Payment date <input type="date" name="payment_date" required /></label>
      <label>Currency
        <select name="currency"><option>SGD</option><option>USD</option><option>EUR</option><option>GBP</option></select>
      </label>
      <label>GST rate (%) <input type="number" name="gst_rate" min="0" max="100" step="0.1" required /></label>
    </div>

    <h2>Items</h2>
    <table>
      <thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Unit price</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <button type="button" id="add" style="margin-top:8px">+ Add item</button>

    <div class="totals">
      <div><span>Subtotal</span><span id="t-sub">0.00</span></div>
      <div><span>GST</span><span id="t-gst">0.00</span></div>
      <div class="grand"><span>Total</span><span id="t-total">0.00</span></div>
    </div>

    <div class="actions"><button type="submit" class="primary">Download PDF</button><span id="msg"></span></div>
  </form>
</main>
<script>
function $(s, root = document) { return root.querySelector(s); }
const form = $("#f"), rows = $("#rows");

function addRow(item = { description: "", quantity: 1, unit_price: 0 }) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input class="d" required maxlength="200" /></td>
    <td><input class="q num" type="number" min="0.01" step="any" required /></td>
    <td><input class="p num" type="number" min="0" step="0.01" required /></td>
    <td class="amt">0.00</td>
    <td><button type="button" class="x" aria-label="Remove item">×</button></td>`;
  $(".d", tr).value = item.description; $(".q", tr).value = item.quantity; $(".p", tr).value = item.unit_price;
  tr.querySelector(".x").onclick = () => { if (rows.children.length > 1) { tr.remove(); recalc(); } };
  rows.append(tr);
}
function items() {
  return [...rows.children].map((tr) => ({
    description: $(".d", tr).value, quantity: +$(".q", tr).value, unit_price: +$(".p", tr).value,
  }));
}
function recalc() {
  const rate = (+form.gst_rate.value || 0) / 100;
  let sub = 0;
  [...rows.children].forEach((tr) => {
    const amt = Math.round(+$(".q", tr).value * +$(".p", tr).value * 100) / 100;
    $(".amt", tr).textContent = amt.toFixed(2); sub += amt;
  });
  sub = Math.round(sub * 100) / 100;
  const gst = Math.round(sub * rate * 100) / 100;
  $("#t-sub").textContent = sub.toFixed(2); $("#t-gst").textContent = gst.toFixed(2); $("#t-total").textContent = (sub + gst).toFixed(2);
}

form.addEventListener("input", recalc);
$("#add").onclick = () => { addRow(); recalc(); };
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#msg").textContent = "";
  const body = Object.fromEntries(new FormData(form));
  body.gst_rate = (+body.gst_rate || 0) / 100;
  body.items = items();
  const res = await fetch("/api/invoice-generator/pdf", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { $("#msg").textContent = "Could not generate the PDF - check the fields."; return; }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: `${body.invoice_number}.pdf` });
  a.click(); URL.revokeObjectURL(a.href);
});

(async () => {
  const d = await (await fetch("/api/invoice-generator/defaults")).json();
  for (const [k, v] of Object.entries(d)) if (form[k] && k !== "items") form[k].value = k === "gst_rate" ? v * 100 : v;
  d.items.forEach(addRow); recalc();
})();
</script>
</body>
</html>
