{% extends "layout.html" %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirm Deletion</h4>
            </div>
            <div class="card-body text-center">
                <h5 class="mb-4">Are you sure you want to delete this account?</h5>
                <p class="text-muted">This action cannot be undone.</p>
                
                <form method="POST" action="{{ url_for('delete_user', user_id=user_id) }}">
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Delete Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
